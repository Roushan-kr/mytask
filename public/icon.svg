<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="6" />

  <!-- Center Icon: Checkmark & Kanban Cards Layer -->
  <g filter="url(#shadow)" transform="translate(40, 40)">
    <!-- Back card snippet -->
    <rect x="120" y="60" width="220" height="130" rx="20" fill="rgba(255,255,255,0.2)" />
    <!-- Front checkmark shield -->
    <path d="M110 220 L180 290 L320 150" fill="none" stroke="url(#glowGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Pulse dot -->
    <circle cx="335" cy="140" r="16" fill="#38bdf8" />
  </g>
</svg>
